name: Build and test
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
permissions:
  contents: read
jobs:
  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Test geometry, numbering, and image export
        run: swift test
      - name: Check editor gestures and repeated hint drawing
        run: ./scripts/check-interactions.sh
      - name: Check local OCR, text selection and clipboard isolation
        run: bash scripts/check-text-recognition.sh
      - name: Check Metal glass rendering (when GPU is available)
        run: bash scripts/check-glass.sh
      - name: Check rapid capture sessions and shortcut lifecycle
        run: ./scripts/check-sessions.sh
      - name: Check own-process overlay exclusion
        run: python3 scripts/check-exclusion.py
      - name: Check permission relaunch lifecycle
        run: ./scripts/check-relaunch.sh
      - name: Check permission recovery responsiveness and progress
        run: bash scripts/check-permission-recovery.sh
      - name: Build universal app
        run: ./scripts/package.sh --universal
      - name: Check stable local signing safeguards
        run: NEBULA_SIGNING_CHECK_APP="dist/Nebula ScreenShot.app" python3 -B -m unittest discover -s Tests/SigningChecks -v
      - uses: actions/upload-artifact@v4
        with:
          name: Nebula-ScreenShot-macOS
          path: |
            dist/*.zip
            dist/*.sha256
